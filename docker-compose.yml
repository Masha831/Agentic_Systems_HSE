services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${IMAGE_TAG:-dev}
    # Тег образа = коммит релиза (make deploy). Откат: make rollback — поднимает предыдущий тег без сборки.
    image: ${APP_IMAGE:-pomnu-app}:${IMAGE_TAG:-latest}
    # .env необязателен: без ключей приложение само включит MOCK
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: backend/data/pomnu.sqlite3
      MEDIA_DIR: backend/data/media
    volumes:
      - pomnu-data:/app/backend/data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      # CADDYFILE=./Caddyfile.open в .env отключает пароль (по умолчанию пароль включён)
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${CADDY_PORT:-8080}:8080"
    depends_on:
      - app
    restart: unless-stopped

  # Публичный адрес без своего домена: docker compose --profile public up -d (или make public)
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: tunnel --no-autoupdate --url http://caddy:8080
    depends_on:
      - caddy
    restart: unless-stopped

  # Постоянный адрес на своём домене: именованный туннель Cloudflare. Туннель и публичное имя
  # (hostname → http://caddy:8080) создаются в панели Cloudflare Zero Trust, токен — в .env (TUNNEL_TOKEN).
  # Запуск: make domain
  tunnel-domain:
    image: cloudflare/cloudflared:latest
    profiles: ["domain"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  pomnu-data:
    # make staging подменяет том, чтобы не трогать данные прода
    name: ${DATA_VOLUME:-pomnu-data}
